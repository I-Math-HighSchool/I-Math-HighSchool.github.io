    <style>
        body { 
            background: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
            min-height: 100vh;
        }
        
        /* HEADER TỔNG */
        .app-header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1030; /* luôn nổi trên nội dung, đồng hồ không bị cuộn mất */
        }
        .main-title {
            font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(45deg, #0284c7, #4f46e5);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; margin: 0;
        }

        /* BỐ CỤC HAI CỘT THÔNG MINH */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .sidebar-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            height: fit-content;
        }

        .exam-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
        }

        /* LƯỚI TIẾN ĐỘ CÂU HỎI TRỰC QUAN */
        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            margin-top: 15px;
        }
        .progress-box {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #64748b;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .progress-box.answered {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0284c7;
        }
        .progress-box.active {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
            border-color: #4f46e5;
        }
        .part-progress-wrapper {
            margin-bottom: 10px;
        }
        .part-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 8px;
        }

        /* ĐỒNG HỒ ĐẾM NGƯỢC VIP */
        /* Tìm đến đoạn này ở thẻ <style> trong file index.html */
        .timer-box {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            font-size: 1.4rem;
            text-align: center;     /* ◄ THẦY SỬA CHỮ 'text-center' THÀNH 'text-align: center;' Ở ĐÂY */
            display: none;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        /* THIẾT KẾ CÂU HỎI GỌN GÀNG */
        .part-header { 
            background: #f1f5f9; padding: 10px 16px; 
            border-left: 4px solid #0284c7; font-weight: 800; 
            color: #0284c7; font-size: 0.95rem; margin: 25px 0 15px 0;
            border-radius: 0 8px 8px 0;
        }
        .question-item { 
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 20px; margin-bottom: 20px;
        }
        .question-item:last-child { border: none; }
        .question-text { font-size: 0.95rem; font-weight: 600; color: #0f172a; line-height: 1.6; }

        /* ĐÁP ÁN GỌN GÀNG HƠN */
        .custom-option-wrapper {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 10px 14px; margin-top: 8px; cursor: pointer; display: flex; align-items: center;
        }
        .custom-option-wrapper:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .form-check-input { width: 1.1rem; height: 1.1rem; flex-shrink: 0; border: 2px solid #64748b; }
        .form-check-label { color: #334155; margin-left: 8px; font-size: 0.9rem; width: 100%; cursor: pointer; }
        .form-check-input:checked ~ .form-check-label { color: #0284c7; font-weight: 700; }

        /* Tô màu đáp án đúng/sai sau khi nộp bài (Phần I - trắc nghiệm) */
        .custom-option-wrapper.option-correct { background: #dcfce7; border-color: #22c55e; }
        .custom-option-wrapper.option-correct .form-check-label { color: #15803d; font-weight: 700; }
        .custom-option-wrapper.option-wrong { background: #fee2e2; border-color: #ef4444; }
        .custom-option-wrapper.option-wrong .form-check-label { color: #b91c1c; font-weight: 700; }

        /* Tô màu đúng/sai cho Phần II (Đúng-Sai) và Phần III (Trả lời ngắn) sau khi nộp bài */
        .form-check.ds-correct-pick { background: #dcfce7; border-radius: 6px; padding: 2px 8px; }
        .form-check.ds-wrong-pick { background: #fee2e2; border-radius: 6px; padding: 2px 8px; }
        .short-box.tl-correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d; }
        .short-box.tl-wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c; }
        .tl-result-icon { font-size: 1.5rem; line-height: 1; display: inline-flex; align-items: center; margin-left: 4px; }
        .tl-result-icon.correct { color: #22c55e; }
        .tl-result-icon.wrong { color: #ef4444; }

        /* FORM ĐÚNG SAI CO GIÃN HÀNG */
        .sub-question-container { background: #f8fafc; border-radius: 10px; padding: 5px 14px; margin-top: 10px; }
        .sub-question-row { padding: 10px 0; display: flex; flex-direction: column; gap: 6px; }
        .sub-question-row:not(:last-child) { border-bottom: 1px solid #e2e8f0; }
        .sub-question-actions { display: flex; gap: 15px; }

        /* Ô VUÔNG PHẦN III ĐẸP MẮT */
        .short-box {
            width: 40px !important; height: 40px !important; text-align: center;
            font-weight: 700; font-size: 1.1rem; border-radius: 6px; border: 2px solid #64748b;
        }
        .short-box:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .explain-box { 
            display: none; background-color: #f0fdf4; padding: 12px; margin-top: 10px; 
            border-radius: 8px; font-size: 0.85rem; color: #14532d; border: 1px solid #bbf7d0; 
            max-width: 100%; overflow-x: hidden; word-wrap: break-word; overflow-wrap: break-word;
        }
        .explain-box img, .question-text img, .sub-question-text img {
            max-width: 100%; height: auto; display: block; margin: 8px auto;
        }
        /* Công thức toán (MathJax) DẠNG KHỐI (hệ PT, phân số lớn xuống dòng
           riêng...) dài trên điện thoại: cho phép cuộn ngang NGAY TRONG công
           thức đó thay vì đẩy vỡ cả layout trang. CHỈ áp dụng cho công thức
           dạng khối (display="true"), KHÔNG áp dụng cho công thức chèn giữa
           dòng chữ (inline) vì overflow/display ép trên inline sẽ làm ký
           hiệu bị lệch dòng, "nhảy" lên khỏi chữ xung quanh. */
        mjx-container[display="true"] {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            display: block !important;
        }
        .question-text, .sub-question-text, .explain-box, .form-check-label {
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .btn-custom-generate { background: #0284c7; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; }
        .btn-custom-submit { background: #4f46e5; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1.05rem; }
        .score-display-box { background: #f0f9ff; border: 1px solid #bae6fd; color: #0369a1; border-radius: 12px; padding: 15px; font-weight: 700; }

        /* ========================================== */
        /* RESPONSIVE CHUYỂN ĐỔI BỐ CỤC LAPTOP MÁY TÍNH */
        /* ========================================== */
        /* ========================================== */
        /* TỐI ƯU CHO ĐIỆN THOẠI (MÀN HÌNH NHỎ)         */
        /* ========================================== */
        @media (max-width: 576px) {
            body { overflow-x: hidden; }
            .app-header { padding: 10px 12px; }
            .main-title { font-size: 1.05rem; }
            .main-title i { margin-right: 4px !important; }
            .timer-box { font-size: 1.05rem; padding: 8px 10px; }
            .main-layout { padding: 12px; gap: 12px; }
            .sidebar-panel, .exam-panel { padding: 14px; border-radius: 12px; }
            .question-text { font-size: 0.92rem; }
            .part-header { font-size: 0.88rem; padding: 8px 12px; margin: 18px 0 12px 0; }
            .progress-grid > .part-progress-wrapper > div[style] {
                grid-template-columns: repeat(5, 1fr) !important;
            }
            .progress-box { height: 36px; font-size: 0.82rem; }
            .explain-box { font-size: 0.82rem; padding: 10px; }
            mjx-container { font-size: 92% !important; }
        }

        @media (min-width: 992px) {
            .main-layout {
                flex-direction: row;
                align-items: flex-start;
                max-width: 1300px;
                margin: 0 auto;
                padding: 30px 20px;
            }
            .sidebar-panel {
                width: 320px;
                position: sticky;
                top: 82px; /* Ghìm chặt bảng điều khiển bên trái khi cuộn đề bên phải, chừa chỗ cho header (đồng hồ) đã cố định phía trên */
                max-height: calc(100vh - 112px); /* trừ thêm chiều cao header để không tràn/đơ khi zoom hoặc màn hình thấp */
                overflow-y: auto;
                overscroll-behavior: contain;
            }
            .exam-panel {
                flex: 1;
                padding: 30px;
            }
            .sub-question-row { flex-direction: row; justify-content: space-between; align-items: center; }
        }
    
        /* NÚT TÁC GIẢ (bấm vào tên trang) */
        .main-title { cursor: pointer; transition: opacity .15s ease; }
        .main-title:hover { opacity: 0.8; }

        /* POPUP THÔNG TIN TÁC GIẢ */
        .author-modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 2000;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .author-modal-overlay.show { display: flex; }
        .author-modal-box {
            background: #ffffff;
            border-radius: 18px;
            max-width: 380px; width: 100%;
            padding: 28px 26px 24px;
            position: relative;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
            text-align: center;
            animation: authorModalPop .18s ease;
        }
        @keyframes authorModalPop {
            from { transform: scale(.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .author-modal-close {
            position: absolute; top: 12px; right: 14px;
            background: none; border: none; font-size: 1.1rem;
            color: #94a3b8; cursor: pointer; line-height: 1;
            padding: 4px;
        }
        .author-modal-close:hover { color: #475569; }
        .author-modal-avatar {
            width: 76px; height: 76px; border-radius: 50%;
            margin: 0 auto 14px;
            background: linear-gradient(45deg, #0284c7, #4f46e5);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.5rem;
            overflow: hidden;
            box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #e0e7ff;
        }
        .author-modal-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .author-modal-name {
            font-weight: 800; font-size: 1.15rem; color: #1e293b; margin-bottom: 10px;
        }
        .author-modal-cred {
            font-size: 0.85rem; color: #475569; margin-bottom: 4px; line-height: 1.5;
        }
        .author-modal-socials {
            display: flex; justify-content: center; gap: 12px; margin-top: 16px;
        }
        .author-modal-socials a {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1rem; text-decoration: none;
            transition: transform .15s ease;
        }
        .author-modal-socials a:hover { transform: translateY(-2px); }
        .social-fb { background: #1877F2; }
        .social-tiktok { background: #000000; }
        .social-yt { background: #FF0000; }
        .social-gmail { background: #EA4335; }
    </style>
</head>
<body>

<header class="app-header shadow-sm d-flex justify-content-between align-items-center">
    <h1 class="main-title" id="brand-title" onclick="openAuthorModal()" title="Xem thông tin tác giả"><i class="fa-solid fa-graduation-cap me-2"></i>I-MATH-HIGHSCHOOL</h1>
    <div class="timer-box text-center" id="exam-timer"><i class="fa-regular fa-clock me-2"></i>90:00</div>
</header>

<main class="main-layout">
    <section class="sidebar-panel shadow-sm">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"><i class="fa-solid fa-user me-1"></i> TÊN THÍ SINH</label>
            <input type="text" class="form-control" id="student-name" placeholder="Nhập tên trước khi nộp...">
        </div>
        
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"><i class="fa-solid fa-layer-group me-1"></i> KHỐI LỚP</label>
            <select class="form-select form-select-sm" id="select-lop">
                <option value="lop12" selected>Khối Lớp 12 (Tốt Nghiệp)</option>
                <option value="lop11">Khối Lớp 11 (THPT)</option>
                <option value="lop10">Khối Lớp 10 (THPT)</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary"><i class="fa-solid fa-book me-1"></i> CHUYÊN ĐỀ / NỘI DUNG THI</label>
            <select class="form-select form-select-sm" id="select-chuong"></select>
        </div>

        <button class="btn btn-custom-generate mb-4 shadow-sm" id="btn-generate" disabled>
            <i class="fa-solid fa-play me-1"></i> PHÁT ĐỀ TÍNH GIỜ
        </button>
        <div class="small text-muted text-center" id="data-load-status">Đang tải ngân hàng câu hỏi...</div>

        <hr class="text-muted">
        
        <label class="form-label small tabular fw-bold text-secondary"><i class="fa-solid fa-grid me-1"></i> TIẾN ĐỘ LÀM BÀI</label>
        <div class="progress-grid" id="progress-grid-box">
            </div>
    </section>

    <section class="exam-panel shadow-sm">
        <form id="quiz-form">
            <div id="quiz-content">
                <div class="text-center text-muted py-5">
                    <i class="fa-solid fa-folder-open fa-3x mb-3 text-info" style="opacity: 0.4;"></i>
                    <p class="mb-0 small">Hệ thống đang đợi lệnh. Vui lòng nhấn nút <strong>"Phát Đề Tính Giờ"</strong> ở bảng điều khiển bên cạnh.</p>
                </div>
            </div>
            
            <div class="mt-4 text-center">
                <button type="button" class="btn btn-custom-submit btn-lg d-none" id="btn-submit">
                    <i class="fa-solid fa-paper-plane me-1"></i> NỘP BÀI VÀ XEM ĐÁP ÁN
                </button>
            </div>
        </form>

        <div id="result-box" class="alert mt-4 d-none score-display-box text-center"></div>
    </section>
</main>

<script src="data/manifest.js"></script>
<script src="js/app.js"></script>

<div class="author-modal-overlay" id="author-modal-overlay" onclick="if(event.target===this) closeAuthorModal()">
    <div class="author-modal-box">
        <button type="button" class="author-modal-close" onclick="closeAuthorModal()" aria-label="Đóng">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="author-modal-avatar"><img src="assets/avatar-logo.png" alt="I-MATH-HIGHSCHOOL"></div>
        <div class="author-modal-name">ThS. Trương Trần Thu Thủy</div>
        <div class="author-modal-cred">🎓 Thạc sĩ Toán ứng dụng - Đại học Khoa học Tự nhiên</div>
        <div class="author-modal-cred">🎓 Cử nhân Sư phạm Toán học - Đại học Sư phạm Thành phố Hồ Chí Minh</div>
        <div class="author-modal-socials">
            <a href="mailto:thuthuy611103@gmail.com" class="social-gmail" title="Gmail"><i class="fa-solid fa-envelope"></i></a>
            <a href="https://www.facebook.com/thuthuy.math" target="_blank" rel="noopener" class="social-fb" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.tiktok.com/@iris.math" target="_blank" rel="noopener" class="social-tiktok" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@truongtranthuthuy6734" target="_blank" rel="noopener" class="social-yt" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </div>
</div>
<script>
    function openAuthorModal() {
        document.getElementById('author-modal-overlay').classList.add('show');
    }
    function closeAuthorModal() {
        document.getElementById('author-modal-overlay').classList.remove('show');
    }
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAuthorModal();
    });
</script>
